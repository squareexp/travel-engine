name: Client checks

on:
  push:
    paths: ["client/**", "shared/api-contracts/**", ".github/workflows/clients.yml"]
  pull_request:
    paths: ["client/**", "shared/api-contracts/**", ".github/workflows/clients.yml"]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  ios-placeholder:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reserve native build verification
        run: echo "Build the SwiftUI project once its shared scheme is committed."

  dashboard-placeholder:
    runs-on: ubuntu-latest
    steps:
      - name: Reserve dashboard build verification
        run: echo "Dashboard build will be enabled when admin-dashboard/package.json is added."
