name: Release API image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/release-api.yml"
  workflow_dispatch:

concurrency:
  group: release-api-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-features

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: travel-engine-api:${{ github.sha }}
          outputs: type=docker,dest=/tmp/travel-engine-api.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: travel-engine-api-linux-amd64
          path: /tmp/travel-engine-api.tar
          retention-days: 30
