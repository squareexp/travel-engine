name: API contract

on:
  push:
    paths: ["shared/api-contracts/**", ".github/workflows/contract.yml"]
  pull_request:
    paths: ["shared/api-contracts/**", ".github/workflows/contract.yml"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli lint shared/api-contracts/openapi.yaml
