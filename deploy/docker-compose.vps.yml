services:
  api:
    image: travel-engine-api:${IMAGE_TAG:-latest}
    container_name: travel-engine-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 256m
    mem_reservation: 96m
    cpus: 0.50
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
