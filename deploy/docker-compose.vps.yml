services:
  api:
    image: ghcr.io/squareexp/travel-engine:${IMAGE_TAG:-latest}
    container_name: travel-engine-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18090:8090"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 256m
    mem_reservation: 96m
    cpus: 0.50
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
